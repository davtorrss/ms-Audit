spring.application.name=ms-vetcare-audit

server.port=8083

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/audit_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Microsoft Entra / JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/b5cc8e1d-1dbb-4b10-bbf5-da56c099e228/v2.0
vetcare.security.audience=75dfa48a-173a-4c90-8413-e6ac41efbc58

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# RabbitMQ Listener
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false


# Apache Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Grupo de consumidores de auditoria
spring.kafka.consumer.group-id=vetcare-audit-group
spring.kafka.consumer.auto-offset-reset=earliest

# Deserializacion de mensajes
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Topico de consultas
vetcare.kafka.topics.consultations=consultations.events


# Productor utilizado para enviar mensajes fallidos a la DLT
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

# Confirmar el procesamiento de cada registro
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

# Topico de mensajes fallidos del consumidor Audit
vetcare.kafka.topics.audit-dlt=consultations.events.audit.DLT

# Topico Kafka para la trazabilidad de consultas
vetcare.kafka.topics.timeline=audit.timeline
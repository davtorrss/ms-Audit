
# ==========================================
# VetCare Audit - Configuracion de pruebas
# ==========================================

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:vetcare_audit_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Crear y eliminar las tablas durante las pruebas
spring.jpa.hibernate.ddl-auto=create-drop

# No iniciar consumidores externos en esta prueba
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
spring.kafka.listener.auto-startup=false

# Configuracion de seguridad exclusiva para pruebas
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://example.invalid/issuer
vetcare.security.audience=vetcare-test
